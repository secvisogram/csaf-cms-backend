# Test overrides for application.properties
# This file must repeat all required properties because it shadows the main application.properties on the test classpath.

# Disable JPA/DataSource auto-configuration for unit tests (MockMvc, etc.)
# Integration tests using @ExtendWith(PostgreSQLExtension.class) override this via System properties.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

server.port=${CSAF_CMS_BACKEND_PORT:8081}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

logging.level.org.springframework.security=DEBUG

csaf.csrf.enabled=false

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.config.import=optional:file:.env[.properties]

# Override JWT configuration: use jwk-set-uri instead of issuer-uri to avoid
# OIDC discovery HTTP calls during test context startup (Spring Security 7+).
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/realms/csaf/protocol/openid-connect/certs

# templates
csaf.document.templates.file=${CSAF_TEMPLATES_FILE:}
csaf.document.templates.companyLogoPath=${CSAF_COMPANY_LOGO_PATH:}

# versioning
csaf.document.versioning=${CSAF_VERSIONING:Semantic}

# revision history
csaf.summary.publication=${CSAF_SUMMARY_PUBLICATION:Initial Publication}

# validation
csaf.validation.baseurl=${CSAF_VALIDATION_BASE_URL:}

# max. levenshtein distance
csaf.versioning.levenshtein=${CSAF_VERSIONING_LEVENSHTEIN:4}

# generation of /document/tracking/id's
csaf.references.baseURL=${CSAF_REFERENCES_BASE_URL:}
csaf.trackingid.company=${CSAF_TRACKINGID_COMPANY:}
csaf.trackingid.digits=${CSAF_TRACKINGID_DIGITS:}
csaf.trackingid.assignment.phase=${CSAF_TRACKINGID_ASSIGNMENT_PHASE:release}
